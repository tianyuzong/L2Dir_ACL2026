<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" role="img" aria-label="L2Dir: Integrating L2-Norm and Directional Alignment for Unsupervised Contrastive Representation Learning in Multimodal Retrieval">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="52%" stop-color="#111C38"/>
      <stop offset="100%" stop-color="#1A1740"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="84%" cy="50%" r="34%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="65%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowLeft" cx="14%" cy="18%" r="34%">
      <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="l2Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <linearGradient id="dirGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#2DD4BF"/>
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.20"/>
    </linearGradient>
    <clipPath id="lensClip">
      <circle cx="0" cy="0" r="118"/>
    </clipPath>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#34D399"/>
    </marker>
    <marker id="arrowGold" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8.5 5 L 0 8.5 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- Outer Rounded Banner Card -->
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#glowCyan)"/>
  <rect x="2" y="2" width="1196" height="316" rx="20" fill="url(#glowLeft)"/>

  <!-- Subtle Grid Pattern -->
  <g stroke="#94A3B8" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="240" y1="0" x2="240" y2="320"/>
    <line x1="480" y1="0" x2="480" y2="320"/>
    <line x1="720" y1="0" x2="720" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Top Venue Badge -->
  <g transform="translate(52, 34)">
    <rect x="0" y="0" width="388" height="32" rx="16" fill="url(#badgeGrad)" stroke="#F59E0B" stroke-opacity="0.6" stroke-width="1"/>
    <circle cx="20" cy="16" r="4.5" fill="#FBBF24"/>
    <text x="35" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="700" letter-spacing="0.9" fill="#FDE68A">ACL 2026 MAIN CONFERENCE  ·  LONG PAPER</text>
  </g>

  <!-- Main Title Wordmark -->
  <g transform="translate(52, 134)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="-1.2">
      <tspan fill="url(#l2Grad)">L2</tspan><tspan fill="url(#dirGrad)">Dir</tspan>
    </text>
    <line x1="196" y1="-45" x2="196" y2="7" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
    <text x="216" y="-24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21.5" font-weight="700" fill="#F8FAFC">Integrating L₂-Norm &amp; Directional Alignment</text>
    <text x="216" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="15.2" font-weight="400" fill="#CBD5E1">Unsupervised Contrastive Representation Learning in Multimodal Retrieval</text>
  </g>

  <!-- Core Formula Equation Strip -->
  <g transform="translate(52, 166)">
    <rect x="0" y="0" width="756" height="44" rx="10" fill="#0F172A" fill-opacity="0.76" stroke="#334155" stroke-width="1"/>
    <text x="20" y="27" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="13.8" fill="#E2E8F0">
      <tspan fill="#94A3B8">Joint Objective: </tspan>
      <tspan fill="#F8FAFC" font-weight="700">L_L2Dir</tspan>
      <tspan fill="#94A3B8"> = </tspan>
      <tspan fill="#38BDF8" font-weight="600">λ·L_InfoNCE(LHS)</tspan>
      <tspan fill="#94A3B8"> + </tspan>
      <tspan fill="#34D399" font-weight="600">(1−λ)·L_InfoTN(NAP)</tspan>
      <tspan fill="#FBBF24" font-weight="600">   [k*=1, t*=1]</tspan>
    </text>
  </g>

  <!-- Feature Pills -->
  <g transform="translate(52, 232)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="12.5" font-weight="600">
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="180" height="34" rx="8" fill="#1E293B" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1"/>
      <text x="90" y="21.5" text-anchor="middle" fill="#BAE6FD">Plug-and-Play NAP</text>
    </g>
    <g transform="translate(192, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="#1E293B" stroke="#34D399" stroke-opacity="0.45" stroke-width="1"/>
      <text x="88" y="21.5" text-anchor="middle" fill="#A7F3D0">Zero Extra Data</text>
    </g>
    <g transform="translate(380, 0)">
      <rect x="0" y="0" width="176" height="34" rx="8" fill="#1E293B" stroke="#818CF8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="88" y="21.5" text-anchor="middle" fill="#C7D2FE">95 Retrieval Tasks</text>
    </g>
    <g transform="translate(568, 0)">
      <rect x="0" y="0" width="188" height="34" rx="8" fill="#1E293B" stroke="#FBBF24" stroke-opacity="0.45" stroke-width="1"/>
      <text x="94" y="21.5" text-anchor="middle" fill="#FDE68A">Zero Inference Cost</text>
    </g>
  </g>

  <!-- Right Side Scientific Diagram: Hypersphere + Norm Shells -->
  <g transform="translate(1018, 160)">
    <circle cx="0" cy="0" r="118" fill="#0F172A" fill-opacity="0.65" stroke="#334155" stroke-width="1.5"/>

    <g clip-path="url(#lensClip)">
      <!-- Iso-norm concentric shells centered at (-44, 46) -->
      <circle cx="-44" cy="46" r="54" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3 4"/>
      <circle cx="-44" cy="46" r="94" fill="none" stroke="#64748B" stroke-width="1.4" stroke-dasharray="5 4"/>
      <circle cx="-44" cy="46" r="132" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- Local Axes -->
      <line x1="-96" y1="46" x2="92" y2="46" stroke="#334155" stroke-width="1.2"/>
      <line x1="-44" y1="96" x2="-44" y2="-92" stroke="#334155" stroke-width="1.2"/>
      <circle cx="-44" cy="46" r="3.5" fill="#94A3B8"/>

      <!-- Initial unaligned target vector (longer norm, offset angle) -->
      <line x1="-44" y1="46" x2="62" y2="-14" stroke="#34D399" stroke-opacity="0.45" stroke-width="2.2" stroke-dasharray="4 3"/>
      <circle cx="62" cy="-14" r="4" fill="#34D399" fill-opacity="0.65"/>

      <!-- Query vector h_q on target shell r=94 -->
      <line x1="-44" y1="46" x2="12" y2="-25" stroke="#38BDF8" stroke-width="3.2" marker-end="url(#arrowBlue)"/>

      <!-- Aligned target vector h_t+ converging to (k*=1, t*=1) -->
      <line x1="-44" y1="46" x2="20" y2="-20" stroke="#34D399" stroke-width="3.2" marker-end="url(#arrowGreen)"/>

      <!-- Directional alignment arc (InfoNCE: t -> 1) -->
      <path d="M 32 1 C 28 -8, 24 -14, 19 -18" fill="none" stroke="#38BDF8" stroke-width="2" marker-end="url(#arrowBlue)"/>

      <!-- Norm alignment arrow along radial direction (InfoTN: k -> 1) -->
      <line x1="59" y1="-12" x2="39" y2="-1" stroke="#FBBF24" stroke-width="2.2" marker-end="url(#arrowGold)"/>

      <!-- Optimal point star glow -->
      <circle cx="17" cy="-26" r="9" fill="#FBBF24" fill-opacity="0.24"/>
      <circle cx="17" cy="-26" r="4.5" fill="#FBBF24"/>

      <!-- Clean Non-overlapping Labels -->
      <text x="-32" y="-44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#FDE68A">(k*, t*) = (1, 1)</text>
      <text x="-76" y="-4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#7DD3FC">h_q</text>
      <text x="52" y="-24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#6EE7B7">h_t⁺</text>
      <text x="30" y="20" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#FCD34D">InfoTN (k→1)</text>
      <text x="-30" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10.5" font-weight="600" fill="#93C5FD">InfoNCE (t→1)</text>
      <text x="0" y="96" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="10" font-weight="500" fill="#94A3B8">Direction + L₂-Norm</text>
    </g>
  </g>
</svg>
